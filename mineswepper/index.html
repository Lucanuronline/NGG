<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minesweeper</title>
    <link rel="stylesheet" href="mineswepper.css">
    <link rel="stylesheet" href="erfolge.css">
</head>
<body>
<div class="splash" id="splash">
    <h1 class="splash-logo">🎮 Minesweeper</h1>
    <div class="splash-balken">
        <div class="splash-balken-fill"></div>
    </div>
</div>

    
<div class="infos">
    <h2 id="minenAnzeige">💣 Minen: 10</h2>
    <h2 id="highscore">🏆 Bestzeit: -</h2>

    <div class="schwierigkeit">
        <button class="Leicht" id="btnLeicht">Leicht</button>
        <button class="Mittel" id="btnMittel">Mittel</button>
        <button class="Schwer" id="btnSchwer">Schwer</button>
    </div>

    <button id="btnRefresh">Neu Starten</button>
    <h1 id="statusText"></h1>
</div>

    <div class="grid" id="grid"></div>


    <script src="../shop.js"></script>
    <script src="mineswepper.js"></script>
    <script src="erfolge.js"></script>
</body>
</html>
