<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Höher Tiefer</title>
    <link rel="stylesheet" href="hoeher-tiefer.css">
</head>
<body>
    <h1>🃏 Höher Tiefer</h1>

    <h2 id="coinsAnzeige">🪙 0 Coins</h2>

    <div class="spielfeld">
        <div class="karte-anzeige">
            <div class="karte" id="aktuelleKarte">?</div>
        </div>
    </div>

    <div class="einsatz-bereich">
        <h3>Einsatz:</h3>
        <input type="number" id="einsatzInput" value="10" min="1" />
        <div class="einsatz-presets">
            <button onclick="setzeEinsatz(10)">10</button>
            <button onclick="setzeEinsatz(25)">25</button>
            <button onclick="setzeEinsatz(50)">50</button>
            <button onclick="setzeEinsatzAlles()">All-in</button>
        </div>
    </div>

    <div class="wett-buttons">
        <button id="btnHoeher" class="hoeher-btn">⬆️ Höher</button>
        <button id="btnTiefer" class="tiefer-btn">⬇️ Tiefer</button>
    </div>

    <h2 id="ergebnisText"></h2>
    <h3 id="siegeAnzeige">Siege in Folge: 0</h3>

    <button id="btnRefresh">Neu Starten</button>

    <script src="../erfolge.js"></script>
    <script src="hoeher-tiefer.js"></script>
</body>
</html>
