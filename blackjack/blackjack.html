<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blackjack</title>
    <link rel="stylesheet" href="blackjack.css">
</head>
<body>

    <div class="splash" id="splash">
    <h1 class="splash-logo">🎮 Blackjack</h1>
    <div class="splash-balken">
        <div class="splash-balken-fill"></div>
    </div>
    <h1 class="splash-text">Spiel wird geladen...</h1>
</div>
    <h1>🂡 Blackjack</h1>

    <h2 id="coinsAnzeige">🪙 0 Coins</h2>

    <div class="tisch">
        <div class="hand-bereich">
            <h3>Dealer <span id="dealerSumme"></span></h3>
            <div class="karten-reihe" id="dealerKarten"></div>
        </div>

        <div class="hand-bereich">
            <h3>Du <span id="spielerSumme"></span></h3>
            <div class="karten-reihe" id="spielerKarten"></div>
        </div>
    </div>

    <div class="einsatz-bereich" id="einsatzBereich">
        <h3>Einsatz:</h3>
        <input type="number" id="einsatzInput" value="10" min="1" />
        <div class="einsatz-presets">
            <button onclick="setzeEinsatz(10)">10</button>
            <button onclick="setzeEinsatz(25)">25</button>
            <button onclick="setzeEinsatz(50)">50</button>
            <button onclick="setzeEinsatzAlles()">All-in</button>
        </div>
        <button id="btnStart" class="start-btn">Karten geben</button>
    </div>

    <div class="spiel-buttons" id="spielButtons" style="display: none;">
        <button id="btnHit" class="hit-btn">Karte ziehen</button>
        <button id="btnStand" class="stand-btn">Halten</button>
    </div>

    <h2 id="ergebnisText"></h2>

    <button id="btnRefresh">Neu Starten</button>

    <script src="../erfolge.js"></script>
    <script src="blackjack.js"></script>
</body>
</html>
